name: Python tests

on:
  push:
    branches:
      - main
      - "ci/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run practical 1 unit tests
        working-directory: 1_practice
        run: python -m unittest discover -s tests -v

      - name: Run practical 2 unit tests
        working-directory: 2_practice
        run: python -m unittest discover -s tests -v
